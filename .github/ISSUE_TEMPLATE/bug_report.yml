name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in Tailery
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix the bug quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this issue?
      placeholder: |
        1. Run `tailery ...`
        2. In TUI press `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: I expected Tailery to...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon / arm64)
        - macOS (Intel / x86_64)
        - Linux (x86_64)
        - Linux (aarch64 / arm64)
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: AI Coding Client(s)
      multiple: true
      options:
        - Cursor
        - Claude Code
        - Zed
        - Google Antigravity
        - Other / N/A
    validations:
      required: true

  - type: dropdown
    id: container-runtime
    attributes:
      label: Container Runtime (if applicable)
      options:
        - Docker Desktop
        - OrbStack
        - Colima
        - Podman
        - Generic / System Docker
        - None (Native stdio / HTTP)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tailery Version
      description: Run `tailery --version` or check `tailery doctor`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: `tailery doctor` Output or Logs
      description: Please paste the output of `tailery doctor` or any relevant terminal logs / crash traces.
      render: shell
      placeholder: "Paste output here..."

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validation Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have verified this behavior on the latest release of Tailery.
          required: true
